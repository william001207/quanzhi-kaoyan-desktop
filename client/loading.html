<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全职高手考研系统 - 正在启动</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #f5f6fa 0%, #eef1f7 100%);
    display: flex; align-items: center; justify-content: center;
    color: #333;
    -webkit-user-select: none; user-select: none;
  }
  .box { text-align: center; }
  .logo {
    width: 84px; height: 84px; margin: 0 auto 28px;
    border-radius: 20px;
    display: block;
    box-shadow: 0 12px 30px rgba(47, 111, 237, 0.28);
  }
  .title { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
  .sub { margin-top: 12px; font-size: 14px; color: #7a8699; line-height: 1.7; }
  .spinner {
    width: 34px; height: 34px; margin: 30px auto 0;
    border: 3px solid rgba(47, 111, 237, 0.15);
    border-top-color: #2f6fed;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { margin-top: 18px; font-size: 12px; color: #a0aab8; }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="icon.png" alt="全职高手考研系统" />
    <div class="title">全职高手考研系统</div>
    <div class="sub">正在初始化本地学习数据库…</div>
    <div class="spinner"></div>
    <div class="hint">首次启动需导入全量真题与知识点，约 1–2 分钟；<br/>之后每次启动约 10–20 秒。数据完全保存在本机。</div>
  </div>
</body>
</html>
