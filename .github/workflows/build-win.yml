# Windows 安装包构建 —— 推送/手动触发后在 GitHub Actions 的 Windows runner 上产出 nsis 安装包
# 说明：本地 Linux 环境无法直接产出 Windows 包（electron-builder 需 wine），因此走 CI。
name: build-windows

# 上传 Release 资产需要 contents: write 权限
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deps (electron / electron-builder)
        run: npm install --no-audit --no-fund

      - name: Install server deps
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Restore server source (62 files from export page)
        shell: bash
        run: |
          python scripts/fetch_source.py || python3 scripts/fetch_source.py

      - name: Build server (tsc)
        working-directory: server
        run: npm run build

      - name: Fetch app icon (from CDN, 生成标准 PNG)
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python scripts/fetch_icon.py || python3 scripts/fetch_icon.py

      - name: Export full data (from online API)
        shell: bash
        run: |
          EXPORT_OUT="$GITHUB_WORKSPACE/server/data-export" python scripts/export_data.py || EXPORT_OUT="$GITHUB_WORKSPACE/server/data-export" python3 scripts/export_data.py
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}

      - name: Fetch client build assets (from CDN)
        shell: bash
        run: |
          CLIENT_OUT="$GITHUB_WORKSPACE/client" python scripts/fetch_client.py || CLIENT_OUT="$GITHUB_WORKSPACE/client" python3 scripts/fetch_client.py

      - name: Package Windows (nsis)
        # --publish never 关闭 electron-builder 自动发布（CI 无 GH_TOKEN，发布由下方 action-gh-release 完成）
        run: npx electron-builder --win --config build/electron-builder.yml --publish never

      - name: Rename installer (ASCII filename)
        # 文件名用英文（ASCII），避免 GitHub 中文文件名下载链接不稳定（404）
        shell: bash
        run: |
          cd release
          for f in *.exe; do
            if [ "$f" != "quanzhi-kaoyan-1.0.0-win-x64.exe" ]; then mv "$f" "quanzhi-kaoyan-1.0.0-win-x64.exe"; fi
          done
          ls -lh

      - name: Upload to GitHub Release (tag push 触发时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          fail_on_unmatched_files: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
