# macOS 安装包（dmg）构建 —— 推 tag（v*）或手动触发后在 macos runner 上产出 dmg
# 说明：dmg 只能在 macOS 上构建（需要 hdiutil），本机为 Linux，因此走 GitHub Actions CI。
# 推 tag 触发时会自动创建/更新 GitHub Release 并上传 dmg；手动触发（workflow_dispatch）只产出 artifact。
name: build-macos

# 上传 Release 资产需要 contents: write 权限
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root deps (electron / electron-builder)
        run: npm install --no-audit --no-fund

      - name: Install server deps
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Restore server source (62 files from export page)
        run: |
          python3 scripts/fetch_source.py

      - name: Build server (tsc)
        working-directory: server
        run: npm run build

      - name: Fetch app icon (from CDN, 生成标准 PNG)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 scripts/fetch_icon.py

      - name: Export full data (from online API)
        run: |
          EXPORT_OUT="$GITHUB_WORKSPACE/server/data-export" python3 scripts/export_data.py
        env:
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}

      - name: Fetch client build assets (from CDN)
        run: |
          CLIENT_OUT="$GITHUB_WORKSPACE/client" python3 scripts/fetch_client.py

      - name: Package macOS (dmg, ad-hoc signed)
        # 先打 dir（未签名 .app），再做 ad-hoc 签名（codesign -s -），最后 hdiutil 制作 dmg。
        # 原因：macOS 新版本（Sequoia+）对完全无签名的 arm64 应用直接判定 malware 且无法绕过；
        # ad-hoc 签名后系统提示「无法验证开发者」，右键打开即可正常使用。
        run: |
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dir --config build/electron-builder.yml --publish never
          echo "== ad-hoc codesign =="
          codesign --force --deep --sign - "release/mac-arm64/全职高手考研系统.app"
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/全职高手考研系统.app" || echo "verify warning (non-fatal)"
          echo "== create dmg =="
          # 文件名用英文（ASCII），避免 GitHub 中文文件名下载链接不稳定（404）
          hdiutil create -volname "全职高手考研系统" -srcfolder "release/mac-arm64/全职高手考研系统.app" -ov -format UDZO "release/quanzhi-kaoyan-1.0.0-mac-arm64.dmg"
          ls -lh release/

      - name: Upload to GitHub Release (tag push 触发时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
          fail_on_unmatched_files: false

      - name: Upload artifact (手动触发时)
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error
